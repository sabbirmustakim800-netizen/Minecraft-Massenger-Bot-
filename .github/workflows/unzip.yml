name: Auto Unzip Goat-bot

on:
  push:
    paths:
      - 'Goat-bot.zip'
  workflow_dispatch:

jobs:
  unzip-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Goat-bot.zip excluding config.json
        run: |
          # config.json বাদ দিয়ে বাকি সব আনজিপ করা হচ্ছে
          unzip -o Goat-bot.zip -x "config.json" -d ./
          rm Goat-bot.zip

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unzipped Goat-bot.zip successfully" || exit 0
          git push
