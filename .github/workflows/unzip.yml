name: Auto Unzip Goat-bot

on:
  push:
    paths:
      - 'Goat-bot.zip' # কেবল Goat-bot.zip আপলোড বা চেঞ্জ হলেই এই অটোরান চালু হবে

jobs:
  unzip-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Goat-bot.zip to Root Folder
        run: |
          # রুট ফোল্ডারে ফাইলগুলো Unzip করা হচ্ছে
          unzip -o Goat-bot.zip -d ./
          # আনজিপ শেষ হলে আসল Zip ফাইলটি মুছে ফেলা হবে
          rm Goat-bot.zip

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unzipped Goat-bot.zip into root directory" || exit 0
          git push
