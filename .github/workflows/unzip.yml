name: Auto Unzip Goat-bot

on:
  push:
    paths:
      - 'Goat-bot.zip'
  workflow_dispatch: # এটি যোগ করলে আপনি হাত দিয়ে বাটন চেপেও রান করতে পারবেন

jobs:
  unzip-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Goat-bot.zip to Root Folder
        run: |
          unzip -o Goat-bot.zip -d ./
          rm Goat-bot.zip

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unzipped Goat-bot.zip into root directory" || exit 0
          git push
